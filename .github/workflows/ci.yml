# CI for every push and pull request (docs/SECURE_CODING.md §6, ADR-0010).
# Actions are pinned to commit SHAs and scanner images to digests; permissions are minimal;
# no pull_request_target. Dependabot keeps the pins current.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Scanner images are pinned by digest; Dependabot can't see these, so bump them by hand
# (monthly, with the release notes and published digests checked).
env:
  TRIVY_IMAGE: aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c # 0.69.3
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 # v8.30.0
  SEMGREP_IMAGE: semgrep/semgrep@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6 # 1.140.0

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.9", enable-cache: true }
      - run: uv sync --locked
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types (strict; packages include their tests)
        run: uv run mypy && uv run mypy packages
      - name: Tests with coverage gates (packages >= 85%, overall >= 70%)
        run: |
          uv run pytest --cov --cov-report=term --cov-fail-under=70
          uv run coverage report --include='packages/*' --fail-under=85
      - name: Dependency vulnerabilities (pip-audit, locked in the dev group)
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-workspace -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
      - name: Licence gate (allowlist, ADR-0010)
        shell: bash # -eo pipefail: a failing producer fails the step
        run: uv run pip-licenses --format=json --from=mixed | uv run python scripts/check_licences.py python

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "26", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build # also generates next-env.d.ts and route types
      - run: pnpm --dir apps/web typecheck
      - name: Dependency vulnerabilities (pnpm audit)
        run: pnpm audit --prod --audit-level high
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.9" }
      - name: Licence gate (allowlist, ADR-0010)
        shell: bash # -eo pipefail: a failing producer fails the step
        run: pnpm --dir apps/web licenses list --prod --json | uv run --no-project python scripts/check_licences.py node

  security-scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Secrets in history (gitleaks)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --exit-code 1
      - name: SAST (semgrep)
        run: >
          docker run --rm -v "$PWD:/src:ro" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/python --config p/typescript
          --config p/dockerfile --config p/secrets
          --exclude '**/tests/**' --exclude '**/*.test.ts'
      - name: IaC and Dockerfile misconfiguration (Trivy config)
        run: >
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE"
          config --exit-code 1 --severity HIGH,CRITICAL /src/deploy

  images-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [python, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { version: "0.13.9", enable-cache: true }
      - name: Build and start the stack
        run: docker compose -f deploy/compose/docker-compose.yml up --build -d --wait
      - name: Image vulnerabilities (Trivy, fixed HIGH/CRITICAL fail the build)
        run: |
          for image in skyline-api:local skyline-worker:local skyline-web:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
              image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image"
          done
      - name: SBOMs (CycloneDX)
        run: |
          mkdir -p sbom
          for image in skyline-api skyline-worker skyline-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
              image --format cyclonedx --quiet "$image:local" > "sbom/$image.cdx.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: sbom/, retention-days: 30 }
      - name: End-to-end smoke test (sign in, scan, 5 findings, fix, auto-resolve)
        run: |
          uv sync --locked
          uv run python deploy/compose/smoke_test.py
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
