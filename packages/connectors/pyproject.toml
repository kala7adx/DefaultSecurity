[project]
name = "skyline-connectors"
version = "0.1.0"
description = "Skyline connectors: read-only provider collectors behind an allowlisted gateway"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.12",
    "skyline-core",
]

[tool.uv.sources]
skyline-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
