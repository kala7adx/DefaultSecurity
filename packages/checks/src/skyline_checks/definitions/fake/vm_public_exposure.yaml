id: fake.compute.vm_public_exposure
version: 1
title: Virtual machine is reachable from the internet
severity: high
provider: fake
resource_types: [fake.compute.vm]
evaluator: python
description: >-
  The virtual machine has a public IP address and at least one attached security group allows
  inbound traffic from any address.
rationale: >-
  A machine that is directly reachable from the internet can be scanned and attacked by anyone.
  Keeping workloads private and publishing them through a load balancer or gateway reduces the
  attack surface.
remediation:
  summary: Remove the public IP address, or restrict the attached security groups to known networks.
  steps:
    - Place the machine behind a load balancer, gateway or bastion instead of giving it a public IP.
    - Remove inbound rules that allow 0.0.0.0/0 or ::/0 from its security groups.
references:
  - title: NCSC Cyber Essentials requirements (firewalls)
    url: https://www.ncsc.gov.uk/cyberessentials/resources
tags: [exposure, network]
